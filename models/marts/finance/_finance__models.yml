version: 2

models:
  - name: fct_cash_movements
    description: >
      Grain: one row per non-deleted cash drawer movement of a non-deleted shift. The source amount is always positive;
      direction and signed_amount come from movement_type (FLOAT_IN, SALE_CASH_IN, OTHER_IN are IN; CASH_OUT,
      REFUND_OUT, OTHER_OUT are OUT). Card, transfer and e-wallet payments are not drawer cash and never appear here.
    columns:
      - name: cash_movement_id
        description: Movement business key (one row per value).
      - name: shift_id
        description: Shift the movement belongs to.
      - name: branch_sk
        description: Key to dim_branches, taken from the shift.
      - name: recorded_by_employee_sk
        description: Employee version valid at occurred_at (dim_employees).
      - name: direction
        description: IN or OUT, derived from movement_type.
      - name: amount
        description: Positive amount as stored in the source.
      - name: signed_amount
        description: Plus amount for IN, minus amount for OUT.
      - name: business_date
        description: Local business date of occurred_at.
      - name: sale_id
        description: Source sale of a cash sale or refund; the source stores no return id.

  - name: fct_shifts
    description: >
      Grain: one row per non-deleted shift. Expected closing cash = opening float + FLOAT_IN + SALE_CASH_IN + OTHER_IN
      - CASH_OUT - REFUND_OUT - OTHER_OUT. The opening float lives on the shift (the source records no FLOAT_IN for it),
      so it is added once. For an OPEN shift the expected figure is the running balance.
    columns:
      - name: shift_id
        description: Shift business key (one row per value).
      - name: branch_sk
        description: Key to dim_branches.
      - name: employee_sk
        description: Employee version valid at opened_at (dim_employees).
      - name: date_sk
        description: YYYYMMDD of business_date (dim_date).
      - name: business_date
        description: Business date of opened_at.
      - name: closed_date_sk
        description: YYYYMMDD of closed_date; NULL while the shift is open.
      - name: opening_float_amount
        description: Cash in the drawer at opening.
      - name: expected_closing_cash_amount
        description: Opening float plus cash in minus cash out.
      - name: counted_closing_cash_amount
        description: Counted cash at closing; NULL until the shift is counted. Today the source sets it equal to expected.
      - name: cash_variance_amount
        description: Counted minus expected (positive over, negative short); NULL when not counted.
      - name: is_counted_equal_expected
        description: True when a count exists and equals the expected cash exactly.
      - name: is_float_in_equal_opening_float
        description: A FLOAT_IN equals the opening float, a possible double count of the float; informational.

  - name: rpt_cash_reconciliation
    description: >
      Grain: one row per non-deleted shift (same rows as fct_shifts) with the reconciliation measures and
      readable branch and employee names. counted_cash_is_independent is per branch and business day: false when
      no shift of that day has a count, or every counted shift equals its expected cash exactly.
      A zero variance then proves nothing about drawer losses.
    columns:
      - name: shift_id
        description: Shift business key (one row per value).
      - name: date_sk
        description: YYYYMMDD of business_date, the business day the shift opened (dim_date).
      - name: expected_closing_cash_amount
        description: Opening float plus cash in minus cash out.
      - name: counted_closing_cash_amount
        description: Counted cash at closing; NULL until counted.
      - name: cash_variance_amount
        description: Counted minus expected; NULL when not counted.
      - name: variance_status
        description: NOT_COUNTED, BALANCED, OVER or SHORT.
      - name: counted_cash_is_independent
        description: False when the count of that branch and day cannot be trusted as a real physical count.
